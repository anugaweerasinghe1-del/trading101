  </g><use href="#lock" x="24" y="204"/><text x="46" y="216" fill="#c0c9da" font-size="12" letter-spacing="2">LOCKED</text><text x="24" y="256" fill="#fff" font-size="25" font-family="Georgia, serif">Market Compass</text><text x="24" y="286" fill="#c8d0df" font-size="14">Markets and instruments</text><text x="24" y="323" fill="#c8d0df" font-size="13">Checkpoint available</text></g>
  <g transform="translate(882 201)"><use href="#card"/><g transform="translate(129 120)">
    <use href="#base"/><path d="M0-59 32-40v38L0 17-32-2v-38z" fill="url(#stone)" stroke="#b2bbcd"/><path d="M0-49 23-35v28L0 7-23-7v-28z" fill="#293448" stroke="#b2bbcd"/><path d="M-43-38q-23 40 42 66m44-66Q66 2 1 28M-45-25l-9-9m12 26-12-5m22 19-13 1m90-32 9-9M42-8l12-5M32 6l13 1" fill="none" stroke="#8696af" stroke-width="4"/>
  </g><use href="#lock" x="24" y="204"/><text x="46" y="216" fill="#c0c9da" font-size="12" letter-spacing="2">LOCKED</text><text x="24" y="256" fill="#fff" font-size="22" font-family="Georgia, serif">Foundations Graduate</text><text x="24" y="286" fill="#c8d0df" font-size="14">Foundations v1 completion</text><text x="24" y="323" fill="#c8d0df" font-size="13">Continue the programme</text></g>
  <text x="61" y="603" fill="#c1cbdd" font-size="14">Private by default · Progress is visible only when evidence is available</text>
