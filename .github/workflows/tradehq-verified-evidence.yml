name: TradeHQ Trusted Evidence Cycle
on:
  workflow_run:
    workflows: [TradeHQ Agents]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
jobs:
  collect:
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      # Read-only identity probe; this mints a short-lived job token, not write access.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies for trusted evidence validation
        run: npm ci
      - name: Classify completed monitoring jobs
        id: gate
        run: node scripts/agent-evidence-run-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id }}
          MONITOR_EVENT: ${{ github.event.workflow_run.event }}
      - name: Wait boundedly for exact-main CI; deny explicit failures
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: node scripts/agent-evidence-ci-wait.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
      - name: Validate exact run, attestation, CI and Pages evidence
        if: ${{ steps.gate.outputs.ready == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MONITOR_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
          PURPOSE: ${{ steps.gate.outputs.purpose }}
        run: >-
          node scripts/agent-trusted-evidence.mjs
          --run "$RUN_ID" --monitor-sha "$MONITOR_SHA"
          --main "$MAIN_SHA" --purpose "$PURPOSE"
      - name: Observe real short-lived GitHub job identity without repair authority
        id: workload_identity
        if: ${{ steps.gate.outputs.ready == 'true' }}
        # A blocked identity probe must not disable existing read-only monitoring.
        # Its explicit VERIFIED/BLOCKED report is separate from job success.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent-github-workload-probe.mjs
      - name: Record bounded read-only incident or no-incident handoff
        if: ${{ steps.gate.outputs.ready == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id }}
          MONITOR_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: node scripts/agent-operational-investigation-handoff.mjs
