name: Weekly TradeHQ newsletter draft (never sends)

on:
  schedule:
    # Monday 09:00 Asia/Colombo (UTC+05:30)
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradehq-weekly-newsletter-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Generate private editor-only draft if configured
        env:
          NEWSLETTER_SCHEDULER_TOKEN: ${{ secrets.NEWSLETTER_SCHEDULER_TOKEN }}
          SUPABASE_URL: ${{ secrets.TRADEHQ_SUPABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NEWSLETTER_SCHEDULER_TOKEN" || -z "$SUPABASE_URL" ]]; then
            echo "Newsletter drafting is not activated. Configure both secrets to enable draft generation; no email sent."
            exit 0
          fi
          endpoint="$SUPABASE_URL/functions/v1/newsletter-editor"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "content-type: application/json" \
            -H "x-newsletter-scheduler: $NEWSLETTER_SCHEDULER_TOKEN" \
            -d '{"action":"generate-weekly"}' \
            "$endpoint" > /tmp/newsletter-draft-result.json
          python3 - <<'PY'
          import json
          with open("/tmp/newsletter-draft-result.json", encoding="utf-8") as handle:
              item = json.load(handle)
          data = item.get("data") or {}
          status = data.get("status")
          if status not in ("draft", "approved", "already-exists"):
              raise SystemExit("Weekly newsletter draft was not created: " + str(status))
          print("Private weekly newsletter editorial state:", status)
          PY
