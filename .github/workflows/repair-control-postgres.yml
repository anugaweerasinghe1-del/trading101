name: Disposable repair-control validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controls:
    name: TradeHQ Disposable PostgreSQL controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: tradehq_test
          POSTGRES_PASSWORD: tradehq_ci_only
          POSTGRES_DB: tradehq_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradehq_test -d tradehq_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import {execFileSync} from 'node:child_process'; assert.match(process.env.VALIDATION_SHA,/^[a-f0-9]{40}$/); assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.VALIDATION_SHA);"
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-repair-control-postgres-guard.test.mjs
      - run: node scripts/agent-repair-control-prototype.test.mjs
      - name: Prove distinct-session locking against the disposable database
        run: node scripts/verify-repair-control-postgres.mjs
        env:
          TRADEHQ_DISPOSABLE_CONTROL_TEST: explicit-ci-fixture
          TRADEHQ_CONTROL_TEST_URL: postgres://tradehq_test:tradehq_ci_only@127.0.0.1:5432/tradehq_control_test
      - run: node scripts/verify-daily-postgres-guard.mjs
      - name: Verify stopped owner installation and real concurrent stop denial
        run: node scripts/verify-stopped-control-postgres.mjs
        env:
          TRADEHQ_DISPOSABLE_CONTROL_TEST: explicit-ci-fixture
          TRADEHQ_CONTROL_TEST_URL: postgres://tradehq_test:tradehq_ci_only@127.0.0.1:5432/tradehq_control_test
      - name: Demonstrate full Daily bank lifecycle in isolated PostgreSQL 17
        run: node --import tsx scripts/verify-daily-practice.ts
        env:
          TRADEHQ_DAILY_POSTGRES_TEST: explicit-ci-fixture
          TRADEHQ_DISPOSABLE_CONTROL_TEST: explicit-ci-fixture
          TRADEHQ_CONTROL_TEST_URL: postgres://tradehq_test:tradehq_ci_only@127.0.0.1:5432/tradehq_control_test
      - name: Verify the admin code queue with real concurrent worker connections
        run: node scripts/verify-admin-code-queue-postgres.mjs
        env:
          TRADEHQ_DISPOSABLE_CONTROL_TEST: explicit-ci-fixture
          TRADEHQ_CONTROL_TEST_URL: postgres://tradehq_test:tradehq_ci_only@127.0.0.1:5432/tradehq_control_test

  provider-binding-diagnostic:
    name: Provider credential binding diagnostic (read only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read selected provider deployment metadata without publication authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRADEHQ_VERCEL_VERIFY_TOKEN: ${{ secrets.TRADEHQ_VERCEL_VERIFY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          // Diagnostic only: GET metadata, no release decision, no writes or credential output.
          const read = async (url, token) => {
            if (!token) return {configured:false};
            try {
              const response = await fetch(url, {headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(25000)});
              const data = await response.json();
              return {configured:true,httpStatus:response.status,data};
            } catch (error) { return {configured:true,networkError:error.name}; }
          };
          const cf = await read('https://api.cloudflare.com/client/v4/accounts/01087d56e4cb7b728a7a9ddbcb12b9bb/pages/projects/tradehq-preview', process.env.CLOUDFLARE_API_TOKEN);
          const project = cf.data?.result, deployment = project?.canonical_deployment;
          console.log('PROVIDER_BINDING_CLOUDFLARE '+JSON.stringify({configured:cf.configured,httpStatus:cf.httpStatus,networkError:cf.networkError,errorCodes:cf.data?.errors?.map(e=>e.code),projectName:project?.name,productionBranch:project?.production_branch,canonicalDeployment:deployment?{id:deployment.id,environment:deployment.environment,status:deployment.latest_stage?.status,sha:deployment.deployment_trigger?.metadata?.commit_hash}:null}));
          const vc = await read('https://api.vercel.com/v9/projects/prj_PjOhFr0eppPg8hZQhdeBwTniZWOy?teamId=team_fjZ5ggg0P43MsYFSIHbeHAAO', process.env.TRADEHQ_VERCEL_VERIFY_TOKEN);
          const target = vc.data?.targets?.production;
          console.log('PROVIDER_BINDING_VERCEL '+JSON.stringify({configured:vc.configured,httpStatus:vc.httpStatus,networkError:vc.networkError,projectId:vc.data?.id,production:target?{id:target.id,target:target.target,state:target.readyState,sha:target.meta?.githubCommitSha,branch:target.meta?.githubCommitRef}:null}));
          NODE
