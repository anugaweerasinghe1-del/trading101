name: TradeHQ AI Code Proposals

on:
  issues:
    types: [opened]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradehq-ai-code-request
  cancel-in-progress: false

jobs:
  propose:
    # Public issues are untrusted. Only the exact repository owner can request AI code proposals.
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[TradeHQ Code Request]' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      branch: ${{ steps.assistant.outputs.branch }}
      head_sha: ${{ steps.assistant.outputs.head_sha }}
      base_sha: ${{ steps.assistant.outputs.base_sha }}
      pr_created: ${{ steps.assistant.outputs.pr_created }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Draft a limited frontend patch in a new branch
        id: assistant
        run: node scripts/agent-code-request.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_AGENT_MODEL: gemini-3.5-flash-lite
          TRADEHQ_ISSUE_NUMBER: ${{ github.event.issue.number }}

  verify:
    needs: propose
    if: needs.propose.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.propose.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject missing or mismatched immutable proposal commit
        run: node scripts/ci-validation-gate.mjs --checkout
        env:
          VALIDATION_SHA: ${{ needs.propose.outputs.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Independently reject unsafe or oversized AI source patches
        run: node scripts/verify-ai-pr-scope.mjs
        env:
          TRADEHQ_BASE_SHA: ${{ needs.propose.outputs.base_sha }}
          TRADEHQ_HEAD_SHA: ${{ needs.propose.outputs.head_sha }}
      - run: npm ci
      - name: Check backend invariants without production credentials
        run: npm run verify:backend
      - name: Verify Cloudflare Pages output and normal site build without production credentials
        run: npm run build:cloudflare
        env:
          TRADEHQ_CLOUDFLARE_LIVE: '0'
      - name: Verify Cloudflare route and preview SEO invariants
        run: |
          node scripts/verify-cloudflare-seo.mjs
          node --import tsx scripts/verify-cloudflare-courses-root.ts
      - name: Validate courses and Daily Practice
        run: |
          node --import tsx scripts/verify-course-workflow.ts
          node --import tsx scripts/verify-daily-practice.ts
          node scripts/verify-course-node.mjs

  confirm-pr-created:
    needs: [propose, verify]
    if: always() && needs.propose.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail visibly if GitHub Actions could not create its review PR
        env:
          PR_CREATED: ${{ needs.propose.outputs.pr_created }}
          VALIDATION_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$PR_CREATED" != "true" ]; then
            echo "::error::The AI prepared a branch but GitHub Actions could not create its draft PR. Enable repository Actions > General > Allow GitHub Actions to create pull requests, or open the comparison link from the GitHub issue."
            exit 1
          fi
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "::error::An AI proposal exists but independent validation did not pass ($VALIDATION_RESULT). Do not merge. Inspect the verify job."
            exit 1
          fi
          echo "Draft PR creation and independent validation verified. Production remains unchanged until owner review."

  admin-queue:
    name: Admin code queue worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
      id-token: write
    outputs:
      publication_id: ${{ steps.worker.outputs.publication_id }}
      publication_head: ${{ steps.worker.outputs.publication_head }}
      publication_pr: ${{ steps.worker.outputs.publication_pr }}
      request_id: ${{ steps.worker.outputs.request_id }}
      head_sha: ${{ steps.worker.outputs.head_sha }}
      base_sha: ${{ steps.worker.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Process one owner request without a persistent service credential
        id: worker
        run: node --experimental-strip-types scripts/agent-admin-code-worker.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_AGENT_MODEL: gemini-3.5-flash-lite

  admin-validate:
    name: Admin code independent validation
    needs: admin-queue
    if: needs.admin-queue.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.admin-queue.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/verify-ai-pr-scope.mjs
        env:
          TRADEHQ_BASE_SHA: ${{ needs.admin-queue.outputs.base_sha }}
          TRADEHQ_HEAD_SHA: ${{ needs.admin-queue.outputs.head_sha }}
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run verify:backend
      - run: node --import tsx scripts/verify-course-workflow.ts
      - run: node --import tsx scripts/verify-daily-practice.ts
      - run: npm run build:cloudflare
        env:
          TRADEHQ_CLOUDFLARE_LIVE: '0'

  admin-result:
    name: Admin code queue result
    needs: [admin-queue, admin-validate]
    if: always() && needs.admin-queue.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record independently observed validation in the admin history
        run: node --experimental-strip-types scripts/agent-admin-code-worker.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRADEHQ_QUEUE_REPORT: '1'
          QUEUE_REQUEST_ID: ${{ needs.admin-queue.outputs.request_id }}
          QUEUE_HEAD_SHA: ${{ needs.admin-queue.outputs.head_sha }}

  admin-publication-previews:
    name: Admin code publication previews
    needs: admin-queue
    if: needs.admin-queue.outputs.publication_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Independently check exact-head protected CI, disposable PostgreSQL and both native previews
        run: node --experimental-strip-types scripts/agent-code-publication.mjs --probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ needs.admin-queue.outputs.publication_id }}
          PUBLICATION_HEAD: ${{ needs.admin-queue.outputs.publication_head }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRADEHQ_VERCEL_VERIFY_TOKEN: ${{ secrets.TRADEHQ_VERCEL_VERIFY_TOKEN }}

  admin-publication:
    name: Admin code publication
    needs: [admin-queue, admin-publication-previews]
    if: needs.admin-publication-previews.result == 'success' && needs.admin-queue.outputs.publication_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Redeem the owner approval once and request an exact-head protected squash merge
        run: node --experimental-strip-types scripts/agent-code-publication.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ needs.admin-queue.outputs.publication_id }}
          PUBLICATION_HEAD: ${{ needs.admin-queue.outputs.publication_head }}
          PUBLICATION_PR: ${{ needs.admin-queue.outputs.publication_pr }}
