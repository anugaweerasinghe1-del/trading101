name: Cloudflare Pages preview build

on:
  # Called exactly once by Phase 3 for every main PR, including docs and bot PRs.
  workflow_call:
    inputs:
      validation_sha:
        required: true
        type: string
    outputs:
      validated_sha:
        value: ${{ jobs.compatibility.outputs.validated_sha }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Cloudflare build and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      validated_sha: ${{ steps.binding.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.validation_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        id: binding
        run: node scripts/ci-validation-gate.mjs --checkout
        env:
          VALIDATION_SHA: ${{ inputs.validation_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Verify all editorial routes on desktop and mobile with and without JavaScript
        run: |
          for phase in 0 1 2 3; do
            TRADEHQ_BROWSER_PHASE="$phase" node --import tsx scripts/verify-publisher-browser.mjs
          done
      - name: Verify isolated authenticated browser flow (no production accounts)
        run: node scripts/verify-isolated-auth-browser.mjs
      - name: Verify read-only incident follow-up against isolated pages
        run: node scripts/verify-browser-investigation.mjs
      - run: node --import tsx scripts/verify-cloudflare-courses-root.ts
      - name: Verify staging and production SEO headers offline
        run: node scripts/verify-cloudflare-seo.mjs
      - name: Bundle Cloudflare Pages Functions using Wrangler
        run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/tradehq-pages-worker.js
      - name: Validate non-indexable fallback and narrow function routing
        run: |
          node --check scripts/prepare-cloudflare.mjs
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const routes=JSON.parse(readFileSync("dist/_routes.json","utf8")); if (routes.include.includes("/*") || !routes.include.includes("/courses/*")) process.exit(1); const shell=readFileSync("dist/404.html","utf8"); if (!shell.includes("noindex, follow") || shell.includes("rel=\"canonical\"")) process.exit(1);'

      - name: Verify trusted exact-head Pages preview HTTP and SEO
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/verify-exact-pages-preview.mjs
        env:
          VALIDATION_SHA: ${{ inputs.validation_sha || github.sha }}
