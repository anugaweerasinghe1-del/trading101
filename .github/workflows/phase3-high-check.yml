name: Phase 3 High Validation

on:
  workflow_dispatch:
  push:
    branches: [main, phase3-current-20261003]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase3:
    name: TradeHQ Phase 3 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      validated_sha: ${{ steps.binding.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        id: binding
        run: node scripts/ci-validation-gate.mjs --checkout
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Independently verify live protected main and required CI identities
        run: node scripts/verify-live-main-protection.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: node scripts/verify-ci-validation.mjs
      - run: node scripts/verify-release-recovery-readiness.mjs
      - run: node scripts/verify-ai-agents.mjs
      - run: node scripts/verify-gemini-models.mjs
      - run: node scripts/verify-agent-monitor-ideas.mjs
      - run: node scripts/verify-repair-triage.mjs
      - run: node scripts/verify-admin-render-imports.mjs
      - run: node --import tsx scripts/verify-journal-summary.ts
      - run: node --import tsx scripts/verify-provider-quotes.ts
      - run: node --import tsx scripts/verify-refresh-prices.ts
      - run: node --import tsx scripts/verify-market-rate-limit.ts
      - run: node --import tsx scripts/verify-market-requests.ts
      - run: node --import tsx scripts/verify-snapshot-version.ts
      - run: node --import tsx scripts/verify-member-activity.ts
      - run: node scripts/verify-review-engagement.mjs
      - run: node --import tsx scripts/verify-review-admin.ts
      - run: node --import tsx scripts/verify-course-workflow.ts
      - run: node --import tsx scripts/verify-daily-practice.ts
      - run: npm run verify:backend
      - run: npm run build
      - run: node scripts/verify-course-node.mjs
      - run: node --import tsx scripts/verify-cloudflare-courses-root.ts

  cloudflare:
    name: TradeHQ Cloudflare compatibility
    uses: ./.github/workflows/cloudflare-preview-build.yml
    with:
      validation_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  validation:
    name: TradeHQ Required validation
    needs: [phase3, cloudflare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require successful essential jobs on the same commit
        run: node scripts/ci-validation-gate.mjs
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_NEEDS: ${{ toJSON(needs) }}

  release-signals:
    name: TradeHQ Release signals (read only)
    # Do not run for PR previews. This records completed main release evidence.
    needs: [validation]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      native_configured: ${{ steps.native.outputs.configured }}
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm current/prior provider statuses and public routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/agent-release-recovery-readiness.mjs
      - name: Report native verification availability without granting publication
        id: native
        env:
          TRADEHQ_VERCEL_VERIFY_TOKEN: ${{ secrets.TRADEHQ_VERCEL_VERIFY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const configured = Boolean(process.env.TRADEHQ_VERCEL_VERIFY_TOKEN);
          appendFileSync(process.env.GITHUB_OUTPUT, `configured=${configured}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, configured
            ? 'Release signals collected. Separate native verification must succeed before coding publication is confirmed.\n'
            : 'Release signals collected; native Vercel verification is NOT CONFIGURED. The strict readiness check is skipped and autonomous coding production confirmation remains blocked.\n');
          if (!configured) console.log('::warning::Native Vercel verification not configured; coding publication remains blocked.');
          NODE

  release-readiness:
    name: TradeHQ Release & Recovery Readiness (read only)
    # Keep this exact check strict: the deployed publication reconciler requires SUCCESS.
    # A skipped check cannot confirm autonomous production publication.
    needs: [validation, release-signals]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validation.result == 'success' && needs.release-signals.outputs.native_configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm current/prior provider statuses and public routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRADEHQ_VERCEL_VERIFY_TOKEN: ${{ secrets.TRADEHQ_VERCEL_VERIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; assert.ok(process.env.CLOUDFLARE_API_TOKEN && process.env.TRADEHQ_VERCEL_VERIFY_TOKEN, 'Native provider verification credentials required');"
          node scripts/agent-release-recovery-readiness.mjs
