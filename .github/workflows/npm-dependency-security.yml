name: npm dependency security evidence
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/report-npm-dependency-security.mjs"
      - ".github/workflows/npm-dependency-security.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Dependency vulnerability inventory (full and runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report advisory evidence for complete and production dependency trees
        run: node scripts/report-npm-dependency-security.mjs

  safe_lockfile_repair:
    name: Safe non-major dependency lockfile repair
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/dependency-audit-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Apply only npm-compatible non-forced advisory fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-fund
          node scripts/report-npm-dependency-security.mjs
      - name: Review and commit the generated lockfile changes only
        run: |
          git diff --stat
          git status --short
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json package.json
            git diff --cached --check
            git commit -m "Apply compatible npm advisory fixes without major version upgrades"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
