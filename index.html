<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ULTIMATE TITLE & META (max CTR + ranking) -->

    <meta data-static-head name="description" content="Practice stock, crypto, ETF, forex & commodities trading with $100,000 virtual cash. No signup. AI mentor, simulated charts, portfolio tracking & 170 assets. Free educational trading simulator.">

    <meta name="author" content="TradeHQ" />
    <meta name="google-adsense-account" content="ca-pub-4160578126993254" />
    <!-- Google CMP messages are published in AdSense. The tag must load independently
         of the optional Amplitude choice so rejecting analytics cannot hide the CMP. -->
    <script async id="tradehq-adsense" crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4160578126993254"></script>
    <meta data-static-head name="robots" content="index, follow" />
    <meta name="google-site-verification" content="I9Z6Vo-t00zuqHRrR_RFgAZ14hsA5YzA0gHeK2POL-I" />

    <!-- PRELOAD CRITICAL RESOURCES (Lighthouse boost) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CANONICAL: injected per-route by prerender (scripts/prerender.ts).
         Homepage canonical is added by the prerender pass; do NOT hardcode
         here or every subroute inherits it and dedupes to the homepage. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#0A0A0F" />

    <!-- OPEN GRAPH (maximum shares) -->
    <meta data-static-head property="og:type" content="website" />
    <meta data-static-head property="og:site_name" content="TradeHQ" />
    <meta data-static-head property="og:url" content="https://www.thetradehq.com/" />
    <meta data-static-head property="og:title" content="TradeHQ — Free Paper Trading Simulator | $100K Virtual Cash (No Signup)" />
    <meta data-static-head property="og:description" content="Practice stocks, crypto, forex & ETFs with $100,000 virtual money. AI mentor + simulated charts. Core simulator features work without signup." />
    <meta data-static-head property="og:image" content="https://www.thetradehq.com/tradehq-preview-2026.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta data-static-head property="og:locale" content="en_US" />

    <!-- TWITTER CARD -->
    <meta data-static-head name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@tradehq" />

    <!-- SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TradeHQ",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "Free paper trading simulator with $100,000 virtual cash for stocks, crypto, ETFs, forex and commodities.",
      "featureList": [

        "Portfolio performance tracking",
        "Leaderboard competition",
        "Technical analysis indicators",

      ],
      "url": "https://www.thetradehq.com/",
      "author": { "@type": "Organization", "name": "TradeHQ" }
    }
    </script>

    <!-- EducationalOrganization (kept — gives Google rich education cards) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "TradeHQ",
      "url": "https://www.thetradehq.com/",
      "logo": "https://www.thetradehq.com/logo.png",
      "description": "Interactive financial education platform teaching stock trading, crypto investment, and portfolio management through interactive simulation.",
      "areaServed": "Worldwide",

        "Technical Analysis",

  </head>
